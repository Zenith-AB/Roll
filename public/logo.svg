<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Monkey - side profile, playful with curled tail -->
  <!-- Head -->
  <circle cx="22" cy="18" r="12" stroke="white" stroke-width="3.5" fill="none"/>
  <!-- Ear -->
  <circle cx="12" cy="10" r="5" stroke="white" stroke-width="3" fill="none"/>
  <!-- Eye -->
  <circle cx="19" cy="16" r="2.5" fill="white"/>
  <!-- Snout bump -->
  <path d="M 28 22 Q 34 22 33 16" stroke="white" stroke-width="3" stroke-linecap="round" fill="none"/>
  <!-- Body -->
  <path d="M 26 28 Q 32 32 36 42 Q 38 50 32 54" stroke="white" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <!-- Arm reaching out -->
  <path d="M 28 34 Q 20 40 16 50 L 18 52" stroke="white" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <!-- Back leg -->
  <path d="M 36 46 Q 42 50 44 56" stroke="white" stroke-width="3.5" stroke-linecap="round" fill="none"/>
  <!-- Curled tail -->
  <path d="M 36 42 Q 48 36 52 24 Q 54 16 48 14 Q 42 14 44 20" stroke="white" stroke-width="3.5" stroke-linecap="round" fill="none"/>
</svg>
